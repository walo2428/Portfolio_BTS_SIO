<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <base href="https://walo2428.github.io/Portfolio_BTS_SIO/">
  <title>Page introuvable | Portfolio Omar Talibi</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="commun.css" />
  <style>
    :root { --orange: #ef4444; --dark: #0f172a; --dark-2: #1e293b; --muted: #94a3b8; }
    body { background: var(--dark); color: #f1f5f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; }
    .box { max-width: 560px; }
    .code { font-size: clamp(5rem, 22vw, 9rem); font-weight: 800; line-height: 1; color: var(--orange); font-family: ui-monospace, "Courier New", monospace; }
    .terminal { background: var(--dark-2); border: 1px solid rgba(239,68,68,0.25); border-radius: 14px; padding: 14px 18px; margin: 24px 0; font-family: ui-monospace, "Courier New", monospace; color: #86efac; text-align: left; font-size: 0.95rem; }
    .btn-home { display: inline-block; background: #b91c1c; color: #fff; font-weight: 600; padding: 12px 28px; border-radius: 100px; text-decoration: none; }
    .btn-home:hover { background: #dc2626; color: #fff; }
    p.lead { color: var(--muted); }
  </style>
</head>
<body>
  <main id="contenu">
    <div class="box">
      <div class="code" aria-hidden="true">404</div>
      <h1 class="h3 mt-2">Page introuvable</h1>
      <div class="terminal" aria-hidden="true">$ ping page<br>Destination host unreachable</div>
      <p class="lead">La page demandée n'existe pas ou a été déplacée.</p>
      <a class="btn-home" href="index.html"><i aria-hidden="true" class="bi bi-house-fill me-2"></i>Retour à l'accueil</a>
    </div>
  </main>
</body>
</html>
